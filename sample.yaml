# PixGate — generic sample device YAML (library path).
#
# This is the ONLY YAML PixGate needs: the ESPHome device definition (display + touch + an
# lvgl stub + the wifi/api/web_server boilerplate). Everything shown on the panel is then
# configured at runtime from the web GUI at http://<device-ip>/ — never in YAML
# (DESIGN.md §1, §17).
#
# Replace the `substitutions` and the `display:` / `touchscreen:` blocks with the values for
# your specific board (see devices/ for ready-made per-device base configs).

substitutions:
  name: pixgate
  friendly_name: PixGate

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    # ESP-IDF is the supported framework (every board in devices/ uses it). PixGate stores its
    # dashboard document in NVS, which is available on both frameworks — no special partitioning.
    type: esp-idf

logger:

# Native Home Assistant API. PixGate uses this for runtime entity subscriptions and service
# calls (DESIGN.md §8). Enable "Allow the device to perform Home Assistant actions" in the
# ESPHome integration so service calls work.
api:

ota:
  - platform: esphome

# Provisioning (DESIGN.md §12): join the configured network, otherwise raise an AP so the
# user can enter credentials, and allow ESP Web Tools to set WiFi during a browser flash.
wifi:
  ap:
    ssid: ${friendly_name} Setup

captive_portal:

improv_serial:

# No web_server: dashboard — pixgate auto-loads web_server_base and serves its own GUI at /.

# Pull the PixGate engine straight from GitHub.
external_components:
  - source:
      type: git
      url: https://github.com/jonnybergdahl/PixGate
    components: [pixgate]

# --- Board hardware (replace for your panel) ----------------------------------------------
# Example display + touch. PixGate never references these directly; it rides whatever LVGL
# display the lvgl: component sets up (DESIGN.md §4).
display:
  - platform: ili9xxx
    id: main_display
    model: st7796
    # ...pins, dimensions, rotation, color order live here, per board...

touchscreen:
  - platform: ft63x6
    id: main_touch
    # ...i2c bus / interrupt pin per board...

# Minimal lvgl: stub — PixGate builds its widget tree on top of this at runtime.
lvgl:

# The engine itself. No dashboard configuration here by design.
pixgate:
