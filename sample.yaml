esphome:
  name: pixgate-device
  friendly_name: PixGate Device

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable WiFi
wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"

# Enable logging
logger:

# Enable Home Assistant API for status and OTA
api:
  homeassistant_states: true

ota:
  - platform: esphome

# Web server for the configuration UI
web_server:
  id: my_web_server
  port: 80

# Hardware configuration for Guition JC4827543C
# SPI for QSPI Display
spi:
  - id: quad_spi
    type: quad
    clk_pin: 47
    data_pins: [21, 48, 40, 39]

# I2C for GT911 Touchscreen
i2c:
  sda: 8
  scl: 4

# Backlight control
output:
  - platform: ledc
    pin: 1
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON

touchscreen:
  - platform: gt911
    id: my_touchscreen
    display: my_display
    interrupt_pin: 3
    reset_pin: 38

display:
  - platform: qspi_dbi
    model: CUSTOM
    id: my_display
    dimensions:
      width: 480
      height: 272
    data_rate: 20MHz
    cs_pin:
      number: 45
      ignore_strapping_warning: true
    invert_colors: true
    rotation: 180
    update_interval: never
    auto_clear_enabled: false
    init_sequence:
      - [0xff, 0xa5]
      - [0x36, 0xc0]
      - [0x3A, 0x01]
      - [0x41, 0x03]
      - [0x44, 0x15]
      - [0x45, 0x15]
      - [0x7d, 0x03]
      - [0xc1, 0xbb]
      - [0xc2, 0x05]
      - [0xc3, 0x10]
      - [0xc6, 0x3e]
      - [0xc7, 0x25]
      - [0xc8, 0x11]
      - [0x7a, 0x5f]
      - [0x6f, 0x44]
      - [0x78, 0x70]
      - [0xc9, 0x00]
      - [0x67, 0x21]
      - [0x51, 0x0a]
      - [0x52, 0x76]
      - [0x53, 0x0a]
      - [0x54, 0x76]
      - [0x46, 0x0a]
      - [0x47, 0x2a]
      - [0x48, 0x0a]
      - [0x49, 0x1a]
      - [0x56, 0x43]
      - [0x57, 0x42]
      - [0x58, 0x3c]
      - [0x59, 0x32]
      - [0x5a, 0x41]
      - [0x5b, 0x3C]
      - [0x5c, 0x05]
      - [0x5d, 0x24]
      - [0x5e, 0x12]
      - [0xad, 0x07]
      - [0x8e, 0x16]
      - [0xae, 0x06]
      - [0x8f, 0x1B]
      - [0xaf, 0x07]
      - [0x90, 0x04]
      - [0xb0, 0x04]
      - [0x91, 0x0a]
      - [0xb1, 0x0a]
      - [0x92, 0x16]
      - [0xb2, 0x15]
      - [0xff, 0x00]
      - [0x11, 0x00]
      - [0x29, 0x00]

# LVGL configuration
lvgl:
  id: my_lvgl
  displays:
    - display_id: my_display
      touchscreen_id: my_touchscreen
  # LVGL handles the rendering
  update_interval: never

# PixGate component configuration
external_components:
  - source:
      type: git
      url: https://github.com/jonnybergdahl/PixGate

pixgate:
  display_id: my_display
  web_server_id: my_web_server
  rows: 4
  columns: 4
