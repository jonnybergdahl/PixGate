# PixGate per-board base — Guition JC4827W543C (ESP32-S3, 480x272 QSPI panel + GT911 touch).
#
# QSPI (quad SPI) panel via qspi_dbi with the board's custom init sequence. Pin maps / init
# sequence follow the official ESPHome device page (see link below). Per-board quirks stay
# here, never in the engine (DESIGN.md §17).

substitutions:
  name: pixgate-jc827w543
  friendly_name: PixGate JC827W543

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
api:
ota:
  - platform: esphome

wifi:
  ap:
    ssid: ${friendly_name} Setup
captive_portal:
improv_serial:

web_server:
  version: 3

external_components:
  - source:
      type: local
      path: ../components
    components: [pixgate]

# --- Hardware: 480x272 QSPI panel (qspi_dbi, custom init sequence) ------------------------
# Pin map / init sequence per the official ESPHome device page:
# https://devices.esphome.io/devices/guition-jc4827543c/
spi:
  id: quad_spi
  type: quad
  clk_pin: GPIO47
  data_pins: [GPIO21, GPIO48, GPIO40, GPIO39]

display:
  - platform: qspi_dbi
    id: main_display
    model: CUSTOM
    data_rate: 20MHz
    spi_id: quad_spi
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 480
      height: 272
    cs_pin:
      number: 45
      ignore_strapping_warning: true
    invert_colors: true
    # NOTE: the panel's 180° orientation is baked into the init sequence below
    # (MADCTL reg 0x36 = 0xc0). LVGL rejects `rotation:` on the display, so it is
    # not set here; touch is mirrored to match (see touchscreen transform).
    init_sequence:
      - [0xff, 0xa5]
      - [0x36, 0xc0]
      - [0x3A, 0x01]
      - [0x41, 0x03]
      - [0x44, 0x15]
      - [0x45, 0x15]
      - [0x7d, 0x03]
      - [0xc1, 0xbb]
