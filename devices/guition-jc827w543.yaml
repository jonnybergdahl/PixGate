# Backlight on GPIO1.
output:
  - platform: ledc
    pin: GPIO1
    frequency: 1000Hz
    id: backlight_output
light:
  - platform: monochromatic
    output: backlight_output
    name: Backlight
    restore_mode: ALWAYS_ON

i2c:
  sda: GPIO8
  scl: GPIO4

touchscreen:
  - platform: gt911
    id: main_touch
    interrupt_pin:
      number: GPIO3
      ignore_strapping_warning: true
    reset_pin: GPIO38
    transform:
      mirror_x: true
      mirror_y: true

lvgl:

pixgate:
