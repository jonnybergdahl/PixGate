# PixGate per-board base — Guition JC4827W543C (ESP32-S3, 480x272 QSPI panel + GT911 touch).
#
# QSPI (quad SPI) panel via mipi_spi using the built-in JC4827W543 model preset, which carries
# the panel's init sequence, cs_pin, invert_colors, RGB color order, quad bus mode, data rate
# and dimensions. Per-board quirks stay here, never in the engine (DESIGN.md §17).
# Ref: https://devices.esphome.io/devices/guition-jc4827543c/

substitutions:
  name: pixgate-jc827w543
  friendly_name: PixGate JC827W543

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
api:
ota:
  - platform: esphome

wifi:
  ap:
    ssid: ${friendly_name} Setup
captive_portal:
improv_serial:

# No web_server: dashboard — pixgate auto-loads web_server_base and serves its own GUI at /.

external_components:
  - source:
      type: local
      path: ../components
    components: [pixgate]

# --- Hardware: 480x272 QSPI panel (mipi_spi, JC4827W543 preset) ---------------------------
spi:
  id: quad_spi
  type: quad
  clk_pin: GPIO47
  data_pins: [GPIO21, GPIO48, GPIO40, GPIO39]

display:
  - platform: mipi_spi
    model: JC4827W543
    id: main_display
    spi_id: quad_spi
    auto_clear_enabled: false
    update_interval: never
    # The panel is mounted upside-down; rotate 180°. The old qspi_dbi config baked this into
    # the init sequence as MADCTL 0x36 = 0xc0 (MX+MY). mipi_spi manages MADCTL itself, so the
    # equivalent here is mirror_x + mirror_y. Touch is mirrored to match (see touchscreen below).
    transform:
      mirror_x: true
      mirror_y: true
      swap_xy: false

# Backlight on GPIO1.
output:
  - platform: ledc
    pin: GPIO1
    frequency: 1000Hz
    id: backlight_output
light:
  - platform: monochromatic
    output: backlight_output
    name: Backlight
    restore_mode: ALWAYS_ON

i2c:
  sda: GPIO8
  scl: GPIO4

touchscreen:
  - platform: gt911
    id: main_touch
    interrupt_pin:
      number: GPIO3
      ignore_strapping_warning: true
    reset_pin: GPIO38
    transform:
      mirror_x: true
      mirror_y: true

lvgl:

pixgate:
